name: pal-engine

on:
  push:
    paths: ['packages/pal-core/**', 'eval/**', 'ml/**', 'config/**', 'docs/pal-api.openapi.yaml', 'supabase/**', '.github/workflows/pal-engine.yml']
  pull_request:
    paths: ['packages/pal-core/**', 'eval/**', 'ml/**', 'config/**', 'docs/pal-api.openapi.yaml', 'supabase/**', '.github/workflows/pal-engine.yml']

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.x' }
      - run: npm ci
        working-directory: packages/pal-core
      - name: Lint, typecheck and test (includes separation, instance-id, k-anon, OpenAPI guards)
        run: npm run check
        working-directory: packages/pal-core
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: pal-core type-checks under Deno (edge-function runtime)
        run: deno check packages/pal-core/src/index.ts

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.x' }
      - run: npm ci
        working-directory: eval
      - run: npm run check
        working-directory: eval
      - name: Run harness end to end
        run: npm run eval
        working-directory: eval
      - uses: actions/upload-artifact@v4
        with: { name: pal-eval-reports, path: eval/out/ }

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r ml/requirements.txt
      - run: python -m pytest ml/tests -q
